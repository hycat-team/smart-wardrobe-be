name: Deploy VPS Services

# Deploys the 3-service topology to the VPS (FR-056): matrix per service so one
# service failing does not block the others, images pushed to GHCR and pinned by
# digest, then `docker compose up -d <service>`. Used for VPS services
# operations (NGINX_MODE=services).
#
# Requires the `vps-production` environment (approval gate) and the same VPS
# secrets as the rollback workflow.

on:
    workflow_dispatch:
        inputs:
            services:
                description: "Services to deploy (comma-separated, or 'all')"
                required: true
                default: all
                type: string
    # Tag trigger (all services): push `vps-*` to deploy the VPS axis.
    # inputs.services is empty on tag push, so the plan job defaults to all.
    push:
        tags:
            - vps-*

permissions:
    contents: read
    packages: write

concurrency:
    group: closy-vps-services
    cancel-in-progress: false

env:
    GHCR_BASENAME: ${{ github.repository_owner }}

jobs:
    plan:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set.outputs.matrix }}
        steps:
            - name: Resolve service matrix
              id: set
              shell: bash
              run: |
                  input='${{ inputs.services }}'
                  if [ "${input}" = "all" ] || [ -z "${input}" ]; then
                    echo 'matrix=["account","commerce","ai"]' >> "${GITHUB_OUTPUT}"
                  else
                    services=$(printf '%s' "${input}" | tr -d ' ' | awk -F, '{for(i=1;i<=NF;i++) printf (i>1?",":"") "\""$i"\""}')
                    echo "matrix=[${services}]" >> "${GITHUB_OUTPUT}"
                  fi

    build-push:
        needs: plan
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: ${{ fromJson(needs.plan.outputs.matrix) }}
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Resolve lowercase image name
              id: image
              shell: bash
              run: echo "name=ghcr.io/${GHCR_BASENAME,,}/${{ matrix.service }}" >> "${GITHUB_OUTPUT}"

            - name: Build and push ${{ matrix.service }} image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: services/${{ matrix.service }}/Dockerfile
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ${{ steps.image.outputs.name }}:${{ github.sha }}
                      ${{ steps.image.outputs.name }}:latest
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.service }}

            # On tag push (vps-*), alias the pushed digest with the tag name for
            # traceability (e.g. ghcr.io/<owner>/<svc>:vps-v1.0.0). Server-side
            # only — no rebuild, no pull.
            - name: Alias image with release tag
              if: startsWith(github.ref, 'refs/tags/')
              shell: bash
              run: |
                  IMG='${{ steps.image.outputs.name }}'
                  docker buildx imagetools create --tag "${IMG}:${{ github.ref_name }}" "${IMG}:${{ github.sha }}"

    deploy:
        needs:
            - plan
            - build-push
        runs-on: ubuntu-latest
        environment: vps-production
        strategy:
            fail-fast: false
            # Sequential deploy: the 3 matrix jobs share one .env.deploy on the
            # VPS (read-modify-write), so parallel writes can clobber each other.
            max-parallel: 1
            matrix:
                service: ${{ fromJson(needs.plan.outputs.matrix) }}
        steps:
            - name: Checkout deployment files
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Resolve image digest
              id: digest
              shell: bash
              run: |
                  name="ghcr.io/${GHCR_BASENAME,,}/${{ matrix.service }}"
                  digest=$(docker buildx imagetools inspect "${name}:${{ github.sha }}" --format '{{.Manifest.Digest}}')
                  echo "ref=${name}@${digest}" >> "${GITHUB_OUTPUT}"

            - name: Prepare SSH
              shell: bash
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Create deployment archive
              shell: bash
              run: tar -czf /tmp/closy-svc-deploy.tar.gz deployments/docker-compose.prod.yml deployments/nginx deployments/rabbitmq database/init

            - name: Upload deployment archive
              shell: bash
              run: scp -P "${{ secrets.VPS_SSH_PORT }}" /tmp/closy-svc-deploy.tar.gz "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/closy-svc-deploy.tar.gz"

            - name: Log VPS in to private GHCR
              shell: bash
              run: printf '%s' "${{ secrets.GHCR_READ_TOKEN }}" | ssh -p "${{ secrets.VPS_SSH_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin"

            - name: Deploy pinned service image
              shell: bash
              run: |
                  SERVICE='${{ matrix.service }}'
                  UPPER=$(printf '%s' "${SERVICE}" | tr '[:lower:]' '[:upper:]')
                  LOWER_OWNER=$(printf '%s' "${GHCR_BASENAME}" | tr '[:upper:]' '[:lower:]')
                  ssh -p "${{ secrets.VPS_SSH_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
                    set -e
                    mkdir -p /opt/closy
                    tar -xzf /tmp/closy-svc-deploy.tar.gz -C /opt/closy
                    rm -f /tmp/closy-svc-deploy.tar.gz
                    cd /opt/closy
                    touch .env.deploy
                    grep -v '^${UPPER}_IMAGE=' .env.deploy > .env.deploy.next || true
                    printf '${UPPER}_IMAGE=%s\n' '${{ steps.digest.outputs.ref }}' >> .env.deploy.next
                    mv .env.deploy.next .env.deploy
                    chmod 600 .env.deploy
                    # Backfill sibling pins so compose interpolation passes on the
                    # very first deploy (when .env.deploy lacks the other 2 vars).
                    # Placeholders are never pulled: pull/up below target only ${SERVICE}.
                    for S in ACCOUNT COMMERCE AI; do
                      if ! grep -q \"^\${S}_IMAGE=\" .env.deploy 2>/dev/null; then
                        case \"\${S}\" in
                          ACCOUNT) SVC_LOWER=account ;;
                          COMMERCE) SVC_LOWER=commerce ;;
                          AI) SVC_LOWER=ai ;;
                        esac
                        printf '%s_IMAGE=ghcr.io/${LOWER_OWNER}/%s:latest\n' \"\${S}\" \"\${SVC_LOWER}\" >> .env.deploy
                      fi
                    done
                    docker compose --env-file .env.production --env-file .env.deploy -f deployments/docker-compose.prod.yml config >/dev/null
                    docker compose --env-file .env.production --env-file .env.deploy -f deployments/docker-compose.prod.yml pull ${SERVICE}
                    docker compose --env-file .env.production --env-file .env.deploy -f deployments/docker-compose.prod.yml up -d ${SERVICE}
                    docker compose --env-file .env.production --env-file .env.deploy -f deployments/docker-compose.prod.yml ps ${SERVICE}
                  "

    # Recreate Nginx once after ALL services deployed so the freshly uploaded
    # route map takes effect. depends_on healthy gates every service: if any
    # container is unhealthy the recreate fails and the run goes red here.
    reload-nginx:
        needs: deploy
        runs-on: ubuntu-latest
        environment: vps-production
        steps:
            - name: Prepare SSH
              shell: bash
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Recreate Nginx
              shell: bash
              run: |
                  ssh -p "${{ secrets.VPS_SSH_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
                    cd /opt/closy
                    docker compose --env-file .env.production --env-file .env.deploy -f deployments/docker-compose.prod.yml up -d --force-recreate nginx
                    docker compose --env-file .env.production --env-file .env.deploy -f deployments/docker-compose.prod.yml ps nginx
                  "

    # Per-service smoke through Nginx: fixed matrix over ALL 3 services (not
    # inputs.services) so a single-service deploy still verifies the whole
    # ingress. Greps the service name in the body to prove correct routing,
    # not just HTTP 200.
    smoke-all:
        needs: reload-nginx
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: [account, commerce, ai]
        steps:
            - name: Smoke test ${{ matrix.service }} via Nginx
              shell: bash
              run: |
                  for i in $(seq 1 12); do
                    body=$(curl --fail --silent --show-error "https://api.closy.hycat.online/api/v1/${{ matrix.service }}/health" || true)
                    if printf '%s' "${body}" | grep -q '"service":"${{ matrix.service }}"'; then
                      exit 0
                    fi
                    sleep 5
                  done
                  echo "smoke test failed for ${{ matrix.service }}"
                  printf '%s\n' "${body}"
                  exit 1
