name: Deploy AWS Box

# Deploys the 6-container topology to the AWS external box (GĐ2): matrix per
# service so one service failing does not block the others, images pushed to
# GHCR and pinned by digest, then `docker compose up -d` on the box. The box
# talks ONLY to managed infra (Supabase / Redis Cloud / CloudAMQP) — base env
# lives in /opt/closy-aws/.env.aws on the box (created once from
# .env.aws.example, docs/operations/aws-runbook.md); image pins live in .env.deploy.
#
# Requires the `aws-production` environment (approval gate), the AWS_* secrets,
# and GHCR read access on the box. Smoke test hits the box IP with SNI override
# (--resolve) so no DNS cutover is needed to verify a deploy.

on:
    workflow_dispatch:
        inputs:
            services:
                description: "Services to deploy (comma-separated, or 'all')"
                required: true
                default: all
                type: string
    # Tag trigger (all services): push `aws-*` to deploy the AWS box axis.
    # inputs.services is empty on tag push, so the plan job defaults to all.
    push:
        tags:
            - aws-*

permissions:
    contents: read
    packages: write

concurrency:
    group: closy-aws-box
    cancel-in-progress: false

env:
    GHCR_BASENAME: ${{ github.repository_owner }}

jobs:
    plan:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set.outputs.matrix }}
        steps:
            - name: Resolve service matrix
              id: set
              shell: bash
              run: |
                  input='${{ inputs.services }}'
                  if [ "${input}" = "all" ] || [ -z "${input}" ]; then
                    echo 'matrix=["account","commerce","ai"]' >> "${GITHUB_OUTPUT}"
                  else
                    services=$(printf '%s' "${input}" | tr -d ' ' | awk -F, '{for(i=1;i<=NF;i++) printf (i>1?",":"") "\""$i"\""}')
                    echo "matrix=[${services}]" >> "${GITHUB_OUTPUT}"
                  fi

    build-push:
        needs: plan
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: ${{ fromJson(needs.plan.outputs.matrix) }}
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Resolve lowercase image name
              id: image
              shell: bash
              run: echo "name=ghcr.io/${GHCR_BASENAME,,}/${{ matrix.service }}" >> "${GITHUB_OUTPUT}"

            - name: Build and push ${{ matrix.service }} image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: services/${{ matrix.service }}/Dockerfile
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ${{ steps.image.outputs.name }}:${{ github.sha }}
                      ${{ steps.image.outputs.name }}:latest
                  cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:buildcache
                  cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:buildcache,mode=max

            # On tag push (aws-*), alias the pushed digest with the tag name for
            # traceability (e.g. ghcr.io/<owner>/<svc>:aws-v1.0.0). Server-side
            # only — no rebuild, no pull.
            - name: Alias image with release tag
              if: startsWith(github.ref, 'refs/tags/')
              shell: bash
              run: |
                  IMG='${{ steps.image.outputs.name }}'
                  docker buildx imagetools create --tag "${IMG}:${{ github.ref_name }}" "${IMG}:${{ github.sha }}"

    # Ops tool image (queue topology reconcile). Built once per run and pinned by
    # digest so the deploy-time check runs exactly the binary that was tested.
    build-tool:
        runs-on: ubuntu-latest
        outputs:
            ref: ${{ steps.digest.outputs.ref }}
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Resolve lowercase image name
              id: image
              shell: bash
              run: echo "name=ghcr.io/${GHCR_BASENAME,,}/rabbitmq-topology" >> "${GITHUB_OUTPUT}"

            - name: Build and push rabbitmq-topology
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: shared/tools/rabbitmq-topology/Dockerfile
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ${{ steps.image.outputs.name }}:${{ github.sha }}
                      ${{ steps.image.outputs.name }}:latest
                  cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rabbitmq-topology:buildcache
                  cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rabbitmq-topology:buildcache,mode=max

            - name: Resolve image digest
              id: digest
              shell: bash
              run: |
                  name='${{ steps.image.outputs.name }}'
                  digest=$(docker buildx imagetools inspect "${name}:${{ github.sha }}" --format '{{.Manifest.Digest}}')
                  echo "ref=${name}@${digest}" >> "${GITHUB_OUTPUT}"

    deploy:
        needs:
            - plan
            - build-push
            - build-tool
        runs-on: ubuntu-latest
        environment: aws-production
        steps:
            - name: Checkout deployment files
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare SSH
              shell: bash
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "${{ secrets.AWS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Create deployment archive
              shell: bash
              run: tar -czf /tmp/closy-aws-deploy.tar.gz deployments/docker-compose.aws.yml deployments/nginx

            - name: Upload deployment archive
              shell: bash
              run: scp -P "${{ secrets.AWS_SSH_PORT }}" /tmp/closy-aws-deploy.tar.gz "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:/tmp/closy-aws-deploy.tar.gz"

            - name: Log box in to private GHCR
              shell: bash
              run: printf '%s' "${{ secrets.GHCR_READ_TOKEN }}" | ssh -p "${{ secrets.AWS_SSH_PORT }}" "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" "docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin"

            # RabbitMQ cannot change x-queue-type on an existing queue. If the
            # registry declares a type CloudAMQP does not already hold, every
            # service that declares it dies with 406 PRECONDITION_FAILED. Catch
            # that here — before any container is touched — instead of reading
            # crash-loop logs off the box. Read-only; migrate stays manual.
            #
            # No --network here: there is no broker container on this box, the
            # tool reaches CloudAMQP over the public internet (amqps + TLS from
            # .env.aws).
            - name: Check RabbitMQ queue topology
              shell: bash
              run: |
                  ssh -p "${{ secrets.AWS_SSH_PORT }}" "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" "
                    set -e
                    cd /opt/closy-aws
                    docker pull '${{ needs.build-tool.outputs.ref }}'
                    docker run --rm \
                      --env-file .env.aws \
                      '${{ needs.build-tool.outputs.ref }}' \
                      --mode check
                  "

            - name: Unpack deployment files
              shell: bash
              run: |
                  ssh -p "${{ secrets.AWS_SSH_PORT }}" "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" "
                    set -e
                    mkdir -p /opt/closy-aws
                    tar -xzf /tmp/closy-aws-deploy.tar.gz -C /opt/closy-aws
                    rm -f /tmp/closy-aws-deploy.tar.gz
                  "

            # One shell loop, sequential by design: the services share a single
            # .env.deploy on the box (read-modify-write). Collecting failures and
            # exiting non-zero at the end keeps one broken service from blocking
            # the others (the old fail-fast:false matrix semantics).
            - name: Deploy pinned service images
              shell: bash
              run: |
                  set -uo pipefail
                  failed=''
                  for SERVICE in $(printf '%s' '${{ needs.plan.outputs.matrix }}' | jq -r '.[]'); do
                    UPPER=$(printf '%s' "${SERVICE}" | tr '[:lower:]' '[:upper:]')
                    LOWER_OWNER=$(printf '%s' "${GHCR_BASENAME}" | tr '[:upper:]' '[:lower:]')
                    name="ghcr.io/${LOWER_OWNER}/${SERVICE}"
                    if ! digest=$(docker buildx imagetools inspect "${name}:${{ github.sha }}" --format '{{.Manifest.Digest}}'); then
                      failed="${failed} ${SERVICE}"
                      continue
                    fi
                    if ! ssh -p "${{ secrets.AWS_SSH_PORT }}" "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" "
                      set -e
                      cd /opt/closy-aws
                      test -f .env.aws || { echo 'missing /opt/closy-aws/.env.aws'; exit 1; }
                      touch .env.deploy
                      grep -v '^${UPPER}_IMAGE=' .env.deploy > .env.deploy.next || true
                      printf '${UPPER}_IMAGE=%s\n' '${name}@${digest}' >> .env.deploy.next
                      mv .env.deploy.next .env.deploy
                      chmod 600 .env.deploy
                      # Backfill sibling pins so compose interpolation passes on the
                      # very first deploy (when .env.deploy lacks the other 2 vars).
                      # Placeholders are never pulled: pull/up below target only ${SERVICE}.
                      for S in ACCOUNT COMMERCE AI; do
                        if ! grep -q \"^\${S}_IMAGE=\" .env.deploy 2>/dev/null; then
                          case \"\${S}\" in
                            ACCOUNT) SVC_LOWER=account ;;
                            COMMERCE) SVC_LOWER=commerce ;;
                            AI) SVC_LOWER=ai ;;
                          esac
                          printf '%s_IMAGE=ghcr.io/${LOWER_OWNER}/%s:latest\n' \"\${S}\" \"\${SVC_LOWER}\" >> .env.deploy
                        fi
                      done
                      docker compose --env-file .env.aws --env-file .env.deploy -f deployments/docker-compose.aws.yml config >/dev/null
                      docker compose --env-file .env.aws --env-file .env.deploy -f deployments/docker-compose.aws.yml pull ${SERVICE}-http ${SERVICE}-worker
                      docker compose --env-file .env.aws --env-file .env.deploy -f deployments/docker-compose.aws.yml up -d ${SERVICE}-http ${SERVICE}-worker
                      docker compose --env-file .env.aws --env-file .env.deploy -f deployments/docker-compose.aws.yml ps ${SERVICE}-http ${SERVICE}-worker
                    "; then
                      failed="${failed} ${SERVICE}"
                    fi
                  done
                  if [ -n "${failed}" ]; then
                    echo "deploy failed for:${failed}"
                    exit 1
                  fi

    # Recreate Nginx once after ALL services deployed so the freshly uploaded
    # route map takes effect. --no-deps lets the recreate proceed even when a
    # sibling http container is down (per-service deploys stay independent); the
    # real health gate is smoke-all below, which verifies routing per service.
    reload-nginx:
        needs: deploy
        runs-on: ubuntu-latest
        environment: aws-production
        steps:
            - name: Prepare SSH
              shell: bash
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "${{ secrets.AWS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Recreate Nginx
              shell: bash
              run: |
                  ssh -p "${{ secrets.AWS_SSH_PORT }}" "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" "
                    cd /opt/closy-aws
                    docker compose --env-file .env.aws --env-file .env.deploy -f deployments/docker-compose.aws.yml up -d --force-recreate --no-deps nginx
                    docker compose --env-file .env.aws --env-file .env.deploy -f deployments/docker-compose.aws.yml ps nginx
                  "

    # Per-service smoke through Nginx: fixed matrix over ALL 3 services (not
    # inputs.services) so a single-service deploy still verifies the whole
    # ingress. Greps the service name in the body to prove correct routing,
    # not just HTTP 200. --resolve targets the box IP so no DNS cutover is
    # needed to verify a deploy.
    smoke-all:
        needs: reload-nginx
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: [account, commerce, ai]
        steps:
            - name: Smoke test ${{ matrix.service }} via Nginx
              shell: bash
              run: |
                  host="api-v2.closy.hycat.online"
                  for i in $(seq 1 12); do
                    body=$(curl -4 --connect-timeout 5 --max-time 15 --fail --silent --show-error --resolve "${host}:443:${{ secrets.AWS_HOST }}" "https://${host}/api/v1/${{ matrix.service }}/health" || true)
                    if printf '%s' "${body}" | grep -q '"service":"${{ matrix.service }}"'; then
                      exit 0
                    fi
                    sleep 5
                  done
                  echo "smoke test failed for ${{ matrix.service }}"
                  printf '%s\n' "${body}"
                  exit 1
