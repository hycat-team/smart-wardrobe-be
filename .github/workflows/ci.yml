name: CI

on:
    pull_request:
        branches:
            - main
        paths-ignore:
            - "docs/**"
            - "specs/**"
            - ".specify/**"
            - "**/*.md"
    push:
        branches:
            - main
        paths-ignore:
            - "docs/**"
            - "specs/**"
            - ".specify/**"
            - "**/*.md"

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Go caches are split so the (large) module cache is stored once instead of
# once per job:
#   - ~/go/pkg/mod is keyed only on the dependency hashes, restored by every
#     job and saved only by `vet` on main.
#   - ~/.cache/go-build is content-addressed and job-specific, so each job has
#     its own key. `static`, `swagger-parity` and `build` only restore (their
#     build cache duplicates `vet`/`test`, and saving them is what bloated the
#     repo cache budget).

jobs:
    static:
        name: Static Checks
        runs-on: ubuntu-latest
        env:
            GO_CACHE_SCOPE: static
        steps:
            - name: Checkout source
              uses: actions/checkout@v5

            - name: Set up Go 1.26
              uses: actions/setup-go@v6
              with:
                  go-version: "1.26.x"
                  cache: false

            - name: Restore Go module cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/go/pkg/mod
                  key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
                  restore-keys: go-mod-${{ runner.os }}-

            - name: Restore Go build cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/.cache/go-build
                  key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-vet-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-test-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-

            - name: Run static checks
              run: make fmt-check && make tidy-check && make generate-check

    vet:
        name: Go Vet
        runs-on: ubuntu-latest
        env:
            GO_CACHE_SCOPE: vet
        steps:
            - name: Checkout source
              uses: actions/checkout@v5

            - name: Set up Go 1.26
              uses: actions/setup-go@v6
              with:
                  go-version: "1.26.x"
                  cache: false

            - name: Restore Go module cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/go/pkg/mod
                  key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
                  restore-keys: go-mod-${{ runner.os }}-

            - name: Restore Go build cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/.cache/go-build
                  key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-vet-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-test-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-

            - name: Run go vet
              run: make vet

            - name: Save Go build cache
              if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/cache/save@v5
              with:
                  path: ~/.cache/go-build
                  key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}

            # Single writer for the shared module cache on main.
            - name: Save Go module cache
              if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/cache/save@v5
              with:
                  path: ~/go/pkg/mod
                  key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}

    test:
        name: Unit and Integration Tests
        runs-on: ubuntu-latest
        env:
            GO_CACHE_SCOPE: test
        steps:
            - name: Checkout source
              uses: actions/checkout@v5

            - name: Set up Go 1.26
              uses: actions/setup-go@v6
              with:
                  go-version: "1.26.x"
                  cache: false

            - name: Restore Go module cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/go/pkg/mod
                  key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
                  restore-keys: go-mod-${{ runner.os }}-

            - name: Restore Go build cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/.cache/go-build
                  key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-vet-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-test-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-

            - name: Run tests
              run: make test TEST_FLAGS=-short

            - name: Save Go build cache
              if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/cache/save@v5
              with:
                  path: ~/.cache/go-build
                  key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}

    # 026 D-01: the only job with a database. It builds the schema the documented
    # way (database/init/*.sql, then the per-service migrations) and runs the
    # `TestIntegration*` suites that every other job skips for lack of
    # TEST_DATABASE_URL. Kept separate from `test`/`test-race` so those stay fast
    # and integration tests are not run twice.
    db-integration:
        name: Database-Backed Integration Tests
        runs-on: ubuntu-latest
        timeout-minutes: 30
        services:
            postgres:
                image: pgvector/pgvector:pg17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: smart_wardrobe_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d smart_wardrobe_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
        env:
            # search_path mirrors configs/config.yaml: migrations place tables in
            # module schemas while the repositories use unqualified names.
            TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/smart_wardrobe_test?sslmode=disable&search_path=public,identity,wardrobe,fashion,brand,subscription,aiexecutor,dashboard,shared,community"
            TEST_DATABASE_ALLOW_REGISTRY_ROLLBACK: "true"
        steps:
            - name: Checkout source
              uses: actions/checkout@v5

            - name: Set up Go 1.26
              uses: actions/setup-go@v6
              with:
                  go-version: "1.26.x"
                  cache: false

            - name: Install pinned Goose CLI
              run: |
                  make install-goose
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            # psql is required here (not a hand-rolled splitter): 00-init.sql
            # defines a `$$`-quoted function, so the files must be executed by a
            # client that understands PostgreSQL syntax.
            - name: Build base schema from database/init
              run: |
                  for f in database/init/00-init.sql database/init/01-schema.sql database/init/02-indexes.sql database/init/03-seed.sql; do
                    echo "== ${f} =="
                    PGPASSWORD=postgres psql -h localhost -U postgres -d smart_wardrobe_test \
                      -v ON_ERROR_STOP=1 -q -f "${f}"
                  done

            - name: Apply per-service migrations
              run: |
                  make migrate-up svc=account DB_HOST=localhost DB_USER=postgres DB_PASSWORD=postgres DB_NAME=smart_wardrobe_test
                  make migrate-up svc=commerce DB_HOST=localhost DB_USER=postgres DB_PASSWORD=postgres DB_NAME=smart_wardrobe_test
                  make migrate-up svc=ai DB_HOST=localhost DB_USER=postgres DB_PASSWORD=postgres DB_NAME=smart_wardrobe_test

            - name: Run database-backed integration tests
              run: make test-db-integration

    build:
        name: Build Service Binaries
        runs-on: ubuntu-latest
        env:
            GO_CACHE_SCOPE: build-${{ matrix.service }}
        strategy:
            fail-fast: false
            matrix:
                service: [account, commerce, ai]
        steps:
            - name: Checkout source
              uses: actions/checkout@v5

            - name: Set up Go 1.26
              uses: actions/setup-go@v6
              with:
                  go-version: "1.26.x"
                  cache: false

            - name: Restore Go module cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/go/pkg/mod
                  key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
                  restore-keys: go-mod-${{ runner.os }}-

            - name: Restore Go build cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/.cache/go-build
                  key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-build-account-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-vet-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-test-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-

            - name: Build ${{ matrix.service }}
              run: make build svc=${{ matrix.service }}

            # The account build cache is the shared one: build flags differ from
            # vet/test, so only another build can warm these entries.
            - name: Save Go build cache
              if: always() && matrix.service == 'account' && github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/cache/save@v5
              with:
                  path: ~/.cache/go-build
                  key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}

    buf:
        name: Protobuf Lint and Drift
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v5

            # buf-setup-action was archived on 2026-07-08 and never shipped a
            # Node 24 runtime; the binary is installed directly at the exact
            # version it used to default to (1.50.0), so lint/generate behave
            # identically.
            - name: Install Buf
              run: |
                  sudo curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.50.0/buf-Linux-x86_64" -o /usr/local/bin/buf
                  sudo chmod +x /usr/local/bin/buf
                  buf --version

            - name: Lint protobuf contracts
              run: make buf-lint

            - name: Verify generated stubs are committed (proto drift)
              run: make buf-gen && git diff --exit-code -- contracts/

    swagger-parity:
        name: Swagger 9-Section Parity
        runs-on: ubuntu-latest
        env:
            GO_CACHE_SCOPE: swagger
        steps:
            - name: Checkout source
              uses: actions/checkout@v5

            - name: Set up Go 1.26
              uses: actions/setup-go@v6
              with:
                  go-version: "1.26.x"
                  cache: false

            - name: Restore Go module cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/go/pkg/mod
                  key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
                  restore-keys: go-mod-${{ runner.os }}-

            - name: Restore Go build cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/.cache/go-build
                  key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-vet-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-test-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-

            - name: Generate per-service Swagger
              run: make swagger-all

            - name: Verify Nginx route map covers all API paths
              run: make nginx-check

            - name: Verify Nginx route map is in sync with swagger (drift)
              run: make nginx-routes && git diff --exit-code -- deployments/nginx

            - name: Assert combined docs cover all modules
              shell: bash
              run: |
                  python3 - <<'EOF'
                  import json, sys

                  # Module -> keyword substrings expected in tags/paths.
                  # notification is worker/email-only (no HTTP API), so it is
                  # explicitly exempted and documented here, not asserted.
                  expected = {
                      "identity": ["auth", "me", "user"],
                      "subscription": ["subscription", "billing"],
                      "admin": ["admin"],
                      "wardrobe": ["wardrobe"],
                      "fashion": ["fashion", "category"],
                      "brand": ["brand"],
                      "dashboard": ["dashboard"],
                      "aiexecutor": ["ai", "outfit"],
                  }

                  files = {
                      "account": "services/account/api/swagger/swagger.json",
                      "commerce": "services/commerce/api/swagger/swagger.json",
                      "ai": "services/ai/api/swagger/swagger.json",
                  }

                  haystacks = {}
                  total_paths = 0
                  for svc, path in files.items():
                      with open(path) as f:
                          doc = json.load(f)
                      paths = doc.get("paths", {})
                      if not paths:
                          print(f"FAIL: {svc} swagger has no paths")
                          sys.exit(1)
                      total_paths += len(paths)
                      text = " ".join(paths.keys()).lower()
                      for _, methods in paths.items():
                          for _, op in methods.items():
                              text += " " + " ".join(op.get("tags", [])).lower()
                      haystacks[svc] = text

                  combined = " ".join(haystacks.values())
                  missing = [m for m, kws in expected.items() if not any(k in combined for k in kws)]
                  if missing:
                      print(f"FAIL: missing doc sections for modules: {missing}")
                      sys.exit(1)
                  if total_paths < 50:
                      print(f"FAIL: suspiciously few paths ({total_paths}); generation may be broken")
                      sys.exit(1)
                  print(f"PASS: 8 HTTP modules covered (+notification worker-only exempted), {total_paths} paths total")
                  EOF

    image-build:
        name: Build Service Images
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                service: [account, commerce, ai]
        steps:
            - name: Checkout source
              uses: actions/checkout@v5

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build ${{ matrix.service }} image (no push)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: services/${{ matrix.service }}/Dockerfile
                  push: false
                  platforms: linux/amd64
                  cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:buildcache
                  cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:buildcache,mode=max,ignore-error=true

    test-race:
        name: Race Detector Tests
        runs-on: ubuntu-latest
        env:
            GO_CACHE_SCOPE: race
        steps:
            - name: Checkout source
              uses: actions/checkout@v5

            - name: Set up Go 1.26
              uses: actions/setup-go@v6
              with:
                  go-version: "1.26.x"
                  cache: false

            - name: Restore Go module cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/go/pkg/mod
                  key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
                  restore-keys: go-mod-${{ runner.os }}-

            - name: Restore Go build cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/.cache/go-build
                  key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-vet-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-test-
                      go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-

            - name: Run race detector tests
              run: make test-race TEST_FLAGS=-short

            - name: Save Go build cache
              if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/cache/save@v5
              with:
                  path: ~/.cache/go-build
                  key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}-${{ env.GO_CACHE_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}
