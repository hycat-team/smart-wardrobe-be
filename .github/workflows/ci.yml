name: CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    static:
        name: Static Checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Go 1.25
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"
                  cache: true
                  cache-dependency-path: go.sum

            - name: Run static checks
              run: make fmt-check && make tidy-check && make generate-check

    vet:
        name: Go Vet
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Go 1.25
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"
                  cache: true
                  cache-dependency-path: go.sum

            - name: Run go vet
              run: make vet

    test:
        name: Unit and Integration Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Go 1.25
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"
                  cache: true
                  cache-dependency-path: go.sum

            - name: Run tests
              run: make test

    build:
        name: Build Binary
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Go 1.25
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"
                  cache: true
                  cache-dependency-path: go.sum

            - name: Build backend
              run: make build

    test-race:
        name: Race Detector Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Go 1.25
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"
                  cache: true
                  cache-dependency-path: go.sum

            - name: Run race detector tests
              run: make test-race
