name: CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Codebase & Lint Checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Go 1.25
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"
                  cache: true
                  cache-dependency-path: go.sum

            - name: Run project checks
              run: make check

    test-race:
        name: Race Detector Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Go 1.25
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"
                  cache: true
                  cache-dependency-path: go.sum

            - name: Run race detector tests
              run: make test-race
