<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Thanh toán thành công</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2 style="color: #28a745; text-align: center;">Thanh Toán Thành Công</h2>
        <p>Chào bạn,</p>
        <p>Giao dịch thanh toán của bạn đã được xử lý thành công.</p>
        <div style="text-align: center; margin: 30px 0; padding: 15px; background-color: #f0fff4; border-radius: 5px;">
            <p style="font-size: 16px; color: #333;">Gói dịch vụ: <strong>{{.PlanName}}</strong></p>
            <p style="font-size: 16px; color: #333;">Số tiền: <strong>{{.Amount}}</strong></p>
            <p style="font-size: 14px; color: #666;">Ngày hết hạn: <strong>{{.ExpiresAt}}</strong></p>
        </div>
        <hr style="border: 0; border-top: 1px solid #eeeeee; margin: 20px 0;" />
        <p style="font-size: 12px; color: #999999; text-align: center;">Đây là email tự động, vui lòng không phản hồi email này.</p>
    </div>
</body>
</html>
