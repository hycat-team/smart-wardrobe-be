<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>SmartWardrobe BE - Swagger UI</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
    />
    <style>
      :root {
        color-scheme: light !important;
      }
      .custom-toolbar {
        background-color: #fafafa;
        padding: 10px 20px;
        border-bottom: 1px solid #e8e8e8;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
        font-family: sans-serif;
      }
      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .toolbar-label {
        font-size: 14px;
        color: #555;
      }
      .custom-select {
        padding: 6px 10px;
        border: 1px solid #ccc;
        background: #fff;
        border-radius: 4px;
        font-size: 14px;
        color: #333;
        cursor: pointer;
      }
      .custom-btn {
        padding: 6px 12px;
        border: 1px solid #ccc;
        background: #fff;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.2s;
      }
      .custom-btn:hover {
        background: #eee;
      }
      .custom-btn.primary {
        background: #49cc90;
        color: #fff;
        border-color: #49cc90;
      }
      .custom-btn.primary:hover {
        background: #3b9c6f;
      }
      @media print {
        .custom-toolbar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="custom-toolbar">
      <div class="toolbar-group">
        <span class="toolbar-label">API Version:</span>
        <select id="version-select" class="custom-select"></select>
      </div>
      <div class="toolbar-group">
        <span class="toolbar-label">Module:</span>
        <select id="module-select" class="custom-select"></select>
      </div>
      <button class="custom-btn primary" onclick="expandAll()">
        Mở rộng tất cả (Expand All)
      </button>
      <button class="custom-btn" onclick="collapseAll()">
        Thu gọn tất cả (Collapse All)
      </button>
    </div>

    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
      // Override prefers-color-scheme to force light mode by default
      if (window.matchMedia) {
        const originalMatchMedia = window.matchMedia;
        window.matchMedia = function (query) {
          if (query && query.includes("prefers-color-scheme: dark")) {
            return {
              matches: false,
              media: query,
              onchange: null,
              addListener: function () {},
              removeListener: function () {},
              addEventListener: function () {},
              removeEventListener: function () {},
            };
          }
          return originalMatchMedia(query);
        };
      }

      // Định nghĩa các version API và module spec tương ứng.
      // Khi thêm version mới, thêm entry vào đây và mở rộng modules map.
      const API_VERSIONS = {
        v1: {
          modules: {
            "Tất cả": "/api-docs/swagger.json",
            identity: "/api-docs/modules/identity/swagger.json",
            subscription: "/api-docs/modules/subscription/swagger.json",
            wardrobe: "/api-docs/modules/wardrobe/swagger.json",
            dashboard: "/api-docs/modules/dashboard/swagger.json",
            brand: "/api-docs/modules/brand/swagger.json",
            fashion: "/api-docs/modules/fashion/swagger.json",
          },
        },
      };

      let currentUi = null;

      function loadSpec(url) {
        if (!currentUi) return;
        currentUi.specActions.download(url);
      }

      function populateVersionSelect() {
        const versionSelect = document.getElementById("version-select");
        versionSelect.innerHTML = "";
        Object.keys(API_VERSIONS).forEach((version) => {
          const option = document.createElement("option");
          option.value = version;
          option.textContent = version;
          versionSelect.appendChild(option);
        });
        versionSelect.value = Object.keys(API_VERSIONS)[0];
        populateModuleSelect();
      }

      function populateModuleSelect() {
        const version = document.getElementById("version-select").value;
        const modules = API_VERSIONS[version].modules;
        const moduleSelect = document.getElementById("module-select");
        moduleSelect.innerHTML = "";
        Object.keys(modules).forEach((name) => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          moduleSelect.appendChild(option);
        });
      }

      function onVersionChange() {
        populateModuleSelect();
        const version = document.getElementById("version-select").value;
        loadSpec(API_VERSIONS[version].modules["Tất cả"]);
      }

      function onModuleChange() {
        const version = document.getElementById("version-select").value;
        const moduleName = document.getElementById("module-select").value;
        loadSpec(API_VERSIONS[version].modules[moduleName]);
      }

      window.onload = function () {
        document.getElementById("version-select").addEventListener("change", onVersionChange);
        document.getElementById("module-select").addEventListener("change", onModuleChange);

        currentUi = SwaggerUIBundle({
          url: "/api-docs/swagger.json",
          dom_id: "#swagger-ui",
          deepLinking: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: "StandaloneLayout",
          docExpansion: "none",
        });

        populateVersionSelect();
      };

      function expandAll() {
        document
          .querySelectorAll(".opblock-tag-section:not(.is-open) .opblock-tag")
          .forEach((btn) => btn.click())

        setTimeout(() => {
          document
            .querySelectorAll(
              '.opblock-summary-control:not([aria-expanded="true"])',
            )
            .forEach((btn) => btn.click())
        }, 100)
      }

      function collapseAll() {
        document
          .querySelectorAll('.opblock-summary-control[aria-expanded="true"]')
          .forEach((btn) => btn.click())

        setTimeout(() => {
          document
            .querySelectorAll(".opblock-tag-section.is-open .opblock-tag")
            .forEach((btn) => btn.click())
        }, 100)
      }
    </script>
  </body>
</html>
