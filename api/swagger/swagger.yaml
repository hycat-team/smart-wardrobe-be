info:
  contact: {}
  description: API docs for Smart Wardrobe.
  title: Smart Wardrobe API Document
  version: "1.0"
paths:
  /api/v1/admin/ai/grants:
    get:
      description: Quản trị viên xem các lượt grant chính sách AI đã cấp cho người
        dùng.
      parameters:
      - description: User ID
        in: query
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
      summary: Danh sách hạn mức chính sách AI của người dùng
      tags:
      - Admin AI
    post:
      consumes:
      - application/json
      description: Quản trị viên cấp trực tiếp chính sách hạn mức AI mới cho người
        dùng.
      parameters:
      - description: Thông tin cấp chính sách
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_internal_modules_aiexecutor_application_dto.CreateAIGrantReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
      summary: Cấp chính sách hạn mức AI cho người dùng
      tags:
      - Admin AI
  /api/v1/admin/ai/pricing:
    get:
      description: Quản trị viên xem danh sách bảng giá các model AI của các nhà cung
        cấp.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
      summary: Danh sách cấu hình giá mô hình AI
      tags:
      - Admin AI
  /api/v1/admin/ai/pricing/{id}:
    put:
      consumes:
      - application/json
      description: Quản trị viên cập nhật giá token hoặc tỷ giá quy đổi cho mô hình
        AI.
      parameters:
      - description: Model Config ID
        in: path
        name: id
        required: true
        type: string
      - description: Thông tin cập nhật giá
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_internal_modules_aiexecutor_application_dto.UpdatePricingReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
      summary: Cập nhật cấu hình giá mô hình AI
      tags:
      - Admin AI
  /api/v1/admin/ai/usage:
    get:
      description: Quản trị viên xem nhật ký sử dụng và chi phí AI của một người dùng.
      parameters:
      - description: User ID
        in: query
        name: userId
        required: true
        type: string
      - description: Từ ngày (YYYY-MM-DD)
        in: query
        name: fromDate
        type: string
      - description: Đến ngày (YYYY-MM-DD)
        in: query
        name: toDate
        type: string
      - description: Trang
        in: query
        name: page
        type: integer
      - description: Số bản ghi/trang
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
      summary: Lịch sử sử dụng AI của người dùng
      tags:
      - Admin AI
  /api/v1/admin/audit-logs:
    get:
      description: Quản trị viên tra cứu lịch sử thao tác của các quản trị viên trong
        hệ thống.
      parameters:
      - description: ID admin thực hiện
        in: query
        name: actorUserId
        type: string
      - description: Hành động
        in: query
        name: action
        type: string
      - description: Loại đối tượng
        in: query
        name: targetType
        type: string
      - description: ID đối tượng
        in: query
        name: targetId
        type: string
      - description: Từ ngày (YYYY-MM-DD)
        in: query
        name: fromDate
        type: string
      - description: Đến ngày (YYYY-MM-DD)
        in: query
        name: toDate
        type: string
      - description: Trang
        in: query
        name: page
        type: integer
      - description: Số bản ghi/trang
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_internal_modules_admin_application_dto.AdminAuditLogListRes'
              type: object
      summary: Danh sách nhật ký quản trị (Audit Logs)
      tags:
      - Admin Audit
  /api/v1/admin/brands:
    get:
      consumes:
      - application/json
      description: Cho phép admin lấy danh sách brand phân trang, tìm kiếm theo tên/slug
        và lọc theo trạng thái của brand.
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: q
        type: string
      - enum:
        - pending_review
        - active
        - suspended
        - archived
        in: query
        name: status
        type: string
        x-enum-varnames:
        - PendingReview
        - Active
        - Suspended
        - Archived
      produces:
      - application/json
      responses:
        "200":
          description: Lấy danh sách brand thành công
          schema:
            allOf:
            - $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_internal_modules_brand_application_dto.AdminBrandListRes'
              type: object
      summary: Lấy danh sách brand (Admin)
      tags:
      - Admin Brand
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin brand
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_internal_modules_brand_application_dto.CreateBrandReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_internal_modules_brand_application_dto.BrandRes'
              type: object
      summary: Tạo brand active trực tiếp (Admin)
      tags:
      - Admin Brand
  /api/v1/admin/brands/{brandId}/members:
    get:
      description: Quản trị viên xem danh sách tất cả thành viên của nhãn hàng.
      parameters:
      - description: Brand ID
        in: path
        name: brandId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
      summary: Danh sách thành viên nhãn hàng
      tags:
      - Admin Brand
    post:
      consumes:
      - application/json
      description: Quản trị viên gán người dùng làm nhân viên (staff) của nhãn hàng.
      parameters:
      - description: Brand ID
        in: path
        name: brandId
        required: true
        type: string
      - description: Thông tin người dùng
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_internal_modules_brand_application_dto.AdminAddBrandStaffReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
      summary: Thêm nhân viên cho nhãn hàng
      tags:
      - Admin Brand
  /api/v1/admin/brands/{brandId}/members/{memberId}:
    delete:
      description: Quản trị viên xóa thành viên khỏi nhãn hàng (bảo vệ chủ sở hữu
        duy nhất).
      parameters:
      - description: Brand ID
        in: path
        name: brandId
        required: true
        type: string
      - description: Member ID
        in: path
        name: memberId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
      summary: Gỡ bỏ thành viên khỏi nhãn hàng
      tags:
      - Admin Brand
    patch:
      consumes:
      - application/json
      description: Quản trị viên cập nhật vai trò hoặc trạng thái hoạt động của thành
        viên nhãn hàng.
      parameters:
      - description: Brand ID
        in: path
        name: brandId
        required: true
        type: string
      - description: Member ID
        in: path
        name: memberId
        required: true
        type: string
      - description: Thông tin cập nhật
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_internal_modules_brand_application_dto.AdminUpdateBrandMemberReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
      summary: Cập nhật vai trò/trạng thái thành viên
      tags:
      - Admin Brand
  /api/v1/admin/brands/{brandId}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID brand
        in: path
        name: brandId
        required: true
        type: string
      - description: Trạng thái mới
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_internal_modules_brand_application_dto.UpdateBrandStatusReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_internal_modules_brand_application_dto.BrandRes'
              type: object
      summary: Cập nhật trạng thái brand (Admin)
      tags:
      - Admin Brand
  /api/v1/admin/brands/{brandId}/transfer-ownership:
    post:
      consumes:
      - application/json
      description: Quản trị viên chuyển quyền Owner nhãn hàng cho người dùng khác
        trong nhãn hàng, đồng thời chọn hạ chủ cũ thành staff hoặc gỡ hoàn toàn.
      parameters:
      - description: Brand ID
        in: path
        name: brandId
        required: true
        type: string
      - description: Thông tin chuyển giao
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_internal_modules_brand_application_dto.TransferBrandOwnershipReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
      summary: Chuyển giao quyền sở hữu nhãn hàng
      tags:
      - Admin Brand
  /api/v1/admin/categories:
    get:
      description: Cho phép Admin lấy danh sách toàn bộ danh mục trang phục trong
        hệ thống để quản trị
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách danh mục
          schema:
            allOf:
            - $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/smart-wardrobe-be_internal_modules_wardrobe_application_dto.CategoryRes'
                  type: array
              type: object
      summary: Lấy danh sách danh mục trang phục (Admin)
      tags:
      - Admin Wardrobe
    post:
      consumes:
      - application/json
      description: Cho phép Admin tạo mới một danh mục trang phục trong hệ thống
      parameters:
      - description: Thông tin danh mục cần tạo
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_internal_modules_wardrobe_application_dto.CreateCategoryReq'
      produces:
      - application/json
      responses:
        "201":
          description: Thông tin danh mục sau khi tạo
          schema:
            allOf:
            - $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_internal_modules_wardrobe_application_dto.CategoryRes'
              type: object
      summary: Tạo danh mục trang phục (Admin)
      tags:
      - Admin Wardrobe
  /api/v1/admin/categories/{id}:
    delete:
      description: Cho phép Admin xóa một danh mục trang phục nếu không còn trang
        phục người dùng liên kết
      parameters:
      - description: ID danh mục
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Xóa danh mục thành công
          schema:
            $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
      summary: Xóa danh mục trang phục (Admin)
      tags:
      - Admin Wardrobe
    get:
      description: Cho phép Admin lấy thông tin chi tiết của một danh mục trang phục
        theo ID
      parameters:
      - description: ID danh mục
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin danh mục
          schema:
            allOf:
            - $ref: '#/definitions/smart-wardrobe-be_internal_shared_presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_internal_modules_wardrobe_application_dto.CategoryRes'
              type: object
      summary: Lấy chi tiết danh mục trang phục (Admin)
      tags:
      - Admin Wardrobe
    put:
      consumes:
      - application/json
      description: Cho phép Admin cập nhật thông tin của một danh mục trang phục theo
        ID
      parameters:
      - description: ID danh mục
        in: path
        name: id
        required: true
        type: string
