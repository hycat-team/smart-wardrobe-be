name: closy-dev

# Local dev topology (020): 3 independently deployable services (account/commerce/ai)
# behind an Nginx gateway, sharing Postgres/Redis/RabbitMQ. Mirrors
# deployments/docker-compose.prod.yml but builds service images locally and serves
# plain HTTP. Entry point: http://localhost:8080 (nginx gateway).
#
#   make docker-dev-up     # build + start
#   make docker-dev-down   # stop + wipe volumes
#
# Direct service ports (debug): account :8101, commerce :8102, ai :8103.

services:
    postgres:
        image: pgvector/pgvector:pg17
        container_name: postgres-closy-dev
        restart: always
        env_file:
            - ../.env
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "${DB_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ../database/init:/docker-entrypoint-initdb.d
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: redis-closy-dev
        restart: always
        env_file:
            - ../.env
        command: redis-server --requirepass ${REDIS_PASSWORD}
        ports:
            - "${REDIS_PORT}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    rabbitmq:
        image: rabbitmq:3-management-alpine
        container_name: rabbitmq-closy-dev
        restart: always
        env_file:
            - ../.env
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
        ports:
            - "${RABBITMQ_PORT}:5672"
            - "15672:15672"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
            interval: 10s
            timeout: 5s
            retries: 5

    account:
        build:
            context: ../
            dockerfile: services/account/Dockerfile
        container_name: account-closy-dev
        restart: unless-stopped
        env_file:
            - ../.env
        environment:
            CONFIG_FILE: /app/config/config.yaml
            APP_MODE: all
            DATABASE_MIGRATE_ON_START: "true"
            DATABASE_MIGRATION_TABLE: goose_db_version
            DATABASE_MIGRATION_ALLOW_OUT_OF_ORDER: "true"
            DB_HOST: postgres
            DB_LISTENER_HOST: postgres
            REDIS_HOST: redis
            RABBITMQ_HOST: rabbitmq
            ELASTICSEARCH_ENABLED: "false"
            INGRESS_ACCOUNT_URL: http://account:8080
            INGRESS_COMMERCE_URL: http://commerce:8080
            INGRESS_AI_URL: http://ai:8080
            TZ: Asia/Ho_Chi_Minh
        ports:
            - "8101:8080"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    commerce:
        build:
            context: ../
            dockerfile: services/commerce/Dockerfile
        container_name: commerce-closy-dev
        restart: unless-stopped
        env_file:
            - ../.env
        environment:
            CONFIG_FILE: /app/config/config.yaml
            APP_MODE: all
            DATABASE_MIGRATE_ON_START: "true"
            DATABASE_MIGRATION_TABLE: goose_db_version_commerce
            DATABASE_MIGRATION_ALLOW_OUT_OF_ORDER: "true"
            DB_HOST: postgres
            DB_LISTENER_HOST: postgres
            REDIS_HOST: redis
            RABBITMQ_HOST: rabbitmq
            ELASTICSEARCH_ENABLED: "false"
            INGRESS_ACCOUNT_URL: http://account:8080
            INGRESS_COMMERCE_URL: http://commerce:8080
            INGRESS_AI_URL: http://ai:8080
            TZ: Asia/Ho_Chi_Minh
        ports:
            - "8102:8080"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            # Account owns every historical migration (all module schemas/tables),
            # so it must finish migrating before Commerce runs its own.
            account:
                condition: service_healthy

    ai:
        build:
            context: ../
            dockerfile: services/ai/Dockerfile
        container_name: ai-closy-dev
        restart: unless-stopped
        env_file:
            - ../.env
        environment:
            CONFIG_FILE: /app/config/config.yaml
            APP_MODE: all
            DATABASE_MIGRATE_ON_START: "true"
            DATABASE_MIGRATION_TABLE: goose_db_version_ai
            DATABASE_MIGRATION_ALLOW_OUT_OF_ORDER: "true"
            DB_HOST: postgres
            DB_LISTENER_HOST: postgres
            REDIS_HOST: redis
            RABBITMQ_HOST: rabbitmq
            ELASTICSEARCH_ENABLED: "false"
            INGRESS_ACCOUNT_URL: http://account:8080
            INGRESS_COMMERCE_URL: http://commerce:8080
            INGRESS_AI_URL: http://ai:8080
            TZ: Asia/Ho_Chi_Minh
        ports:
            - "8103:8080"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            account:
                condition: service_healthy

    nginx:
        image: nginx:alpine
        container_name: nginx-closy-dev
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            account:
                condition: service_healthy
            commerce:
                condition: service_healthy
            ai:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --quiet --spider http://127.0.0.1/nginx-health || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s

    ngrok:
        image: ngrok/ngrok:latest
        container_name: ngrok-closy-dev
        env_file:
            - ../.env
        environment:
            NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
        command:
            - "http"
            - "http://nginx:80"
            - "--url=https://${NGROK_DOMAIN}"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - nginx

volumes:
    postgres_data:
    redis_data:
    rabbitmq_data:
