# deployments/nginx/api-v2-routes/commerce.conf — route map api-v2 → Commerce Cloud Run (T069).
# Longest-prefix (`location ^~`). User-facing /ai/* (chat/stream) is served here
# (SSE stream has its own buffering-off stanza in api-v2.conf.template).

location ^~ /api/v1/ai {
    auth_request /_token_helper;
    auth_request_set $serverless_auth $upstream_http_x_serverless_authorization;
    proxy_set_header X-Serverless-Authorization $serverless_auth;
    proxy_ssl_server_name on;
    proxy_pass ${COMMERCE_RUN_URL};
}
