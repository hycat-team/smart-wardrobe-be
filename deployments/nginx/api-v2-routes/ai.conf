# deployments/nginx/api-v2-routes/ai.conf — route map api-v2 → AI Cloud Run (T069).
# The AI *service* serves only /admin/ai/* over HTTP; user-facing /ai/* (chat,
# stream) is served by Commerce (which calls AI via gRPC internally).

location ^~ /api/v1/admin/ai {
    auth_request /_token_helper;
    auth_request_set $serverless_auth $upstream_http_x_serverless_authorization;
    proxy_set_header X-Serverless-Authorization $serverless_auth;
    proxy_ssl_server_name on;
    proxy_pass ${AI_RUN_URL};
}
