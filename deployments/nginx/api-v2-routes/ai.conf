# Code generated by `make nginx-routes` from services/*/api/swagger/swagger.json. DO NOT EDIT.
# api-v2 route map -> ai Cloud Run (FR-028/FR-033).

location ^~ /api/v1/admin/ai {
    auth_request /_token_helper_ai;
    auth_request_set $serverless_auth $upstream_http_x_serverless_authorization;
    proxy_set_header X-Serverless-Authorization $serverless_auth;
    proxy_ssl_server_name on;
    proxy_pass ${AI_RUN_URL};
}
