# deployments/nginx/api-v2-routes/account.conf — route map api-v2 → Account Cloud Run (T069).
# Longest-prefix (`location ^~`); rendered by `make nginx-reload` (envsubst).
# Auth: Cloud Run IAM via token helper (FR-033); app `Authorization` forwarded untouched.

location ^~ /api/v1/auth {
    auth_request /_token_helper;
    auth_request_set $serverless_auth $upstream_http_x_serverless_authorization;
    proxy_set_header X-Serverless-Authorization $serverless_auth;
    proxy_ssl_server_name on;
    proxy_pass ${ACCOUNT_RUN_URL};
}
