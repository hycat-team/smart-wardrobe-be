# deployments/nginx/local.conf — local dev gateway (Docker Compose, HTTP only).
# Mirrors the VPS route map (deployments/nginx/templates/vps-3service.conf.template)
# so local routing matches production: longest-prefix to account/commerce/ai.
# Mounted at /etc/nginx/conf.d/default.conf by deployments/docker-compose.yml.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # Vietnamese JSON error bodies must be decoded as UTF-8 (JSON has no default).
    charset utf-8;
    charset_types application/json;

    # Shared proxy defaults; SSE locations override buffering/timeouts, and the
    # long-running admin batch grant (FR-076) gets a wider proxy budget below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # BEGIN GENERATED ROUTES (make nginx-routes) - do not edit by hand
    location ^~ /api/v1/account { proxy_pass http://account:8080; }
    location ^~ /api/v1/admin/audit-logs { proxy_pass http://account:8080; }
    location ^~ /api/v1/admin/subscription-grants { proxy_pass http://account:8080; proxy_send_timeout 300s; proxy_read_timeout 300s; }
    location ^~ /api/v1/admin/subscriptions { proxy_pass http://account:8080; }
    location ^~ /api/v1/admin/users { proxy_pass http://account:8080; }
    location ^~ /api/v1/auth { proxy_pass http://account:8080; }
    location = /api/v1/me { proxy_pass http://account:8080; }
    location ^~ /api/v1/me/avatar { proxy_pass http://account:8080; }
    location ^~ /api/v1/me/body-profile { proxy_pass http://account:8080; }
    location ^~ /api/v1/me/change-password { proxy_pass http://account:8080; }
    location ^~ /api/v1/subscriptions { proxy_pass http://account:8080; }
    location ^~ /api/v1/admin/brands { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/admin/categories { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/admin/comments { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/admin/dashboard { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/admin/posts { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/admin/wardrobe-items { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/ai/chat { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/ai/chat/sessions { proxy_pass http://commerce:8080; proxy_buffering off; proxy_cache off; proxy_send_timeout 300s; proxy_read_timeout 300s; }
    location ^~ /api/v1/ai/outfit-recommendations { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/brand { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/brand-portal/brands { proxy_pass http://commerce:8080; proxy_buffering off; proxy_cache off; proxy_send_timeout 300s; proxy_read_timeout 300s; }
    location ^~ /api/v1/categories { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/commerce { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/dashboard { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/me/benefit-redemptions { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/me/brand-loyalties { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/me/dashboard { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/me/outfits { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/me/wardrobe-items { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/outfits { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/posts { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/search { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/system-catalog { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/users { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/wardrobe-items { proxy_pass http://commerce:8080; }
    location ^~ /api/v1/wardrobe-items/tasks { proxy_pass http://commerce:8080; proxy_buffering off; proxy_cache off; proxy_send_timeout 300s; proxy_read_timeout 300s; }
    location ^~ /api/v1/admin/ai { proxy_pass http://ai:8080; }
    location ^~ /api/v1/ai/health { proxy_pass http://ai:8080; }
    # END GENERATED ROUTES

    # Monolith-style combined Swagger docs (Account hosts the bundle, behind its
    # access-code lock). Old UI + service/module selectors.
    location ^~ /swagger { proxy_pass http://account:8080; }
    location ^~ /api-docs { proxy_pass http://account:8080; }

    location / {
        default_type "application/json; charset=utf-8";
        return 404 '{"message":"Đường dẫn API không tồn tại hoặc phương thức không được hỗ trợ."}';
    }
}
