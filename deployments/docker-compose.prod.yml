name: closy-prod

# VPS production topology (020): 3 independently deployable services behind the
# Nginx gateway, sharing Postgres/Redis/RabbitMQ. Images come from GHCR and are
# pinned by digest by the deploy workflows (FR-042/FR-051/FR-056).
#
# Rollback path (FR-043): the frozen monolith image runs under the `rollback`
# profile when the owner chooses to fall back:
#   docker compose --profile rollback up -d backend
# It MUST NOT receive new code; only the frozen `monolith-legacy` tag builds it.

services:
    postgres:
        image: pgvector/pgvector:pg17
        restart: always
        mem_limit: 1280m
        shm_size: 256m
        env_file:
            - ../.env.production
        environment:
            POSTGRES_USER: ${DB_USER:?DB_USER is required}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
            POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
            TZ: ${TZ:-Asia/Ho_Chi_Minh}
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ../database/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        networks:
            - data
            - admin
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

    redis:
        image: redis:7-alpine
        restart: always
        mem_limit: 384m
        env_file:
            - ../.env.production
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
            TZ: ${TZ:-Asia/Ho_Chi_Minh}
        command:
            [
                "sh",
                "-c",
                'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"',
            ]
        volumes:
            - redis_data:/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG',
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s
        networks:
            - data
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

    rabbitmq:
        image: rabbitmq:3-management-alpine
        restart: always
        mem_limit: 512m
        env_file:
            - ../.env.production
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
            TZ: ${TZ:-Asia/Ho_Chi_Minh}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
            - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 30s
        networks:
            - data
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

    account:
        image: ${ACCOUNT_IMAGE:?ACCOUNT_IMAGE is required}
        restart: always
        mem_limit: 512m
        env_file:
            - ../.env.production
        environment:
            CONFIG_FILE: /app/config/config.production.yaml
            APP_MODE: ${APP_MODE:-all}
            TZ: ${TZ:-Asia/Ho_Chi_Minh}
        expose:
            - "8080"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --quiet --spider http://127.0.0.1:8080/api/v1/health || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 30s
        stop_grace_period: 30s
        security_opt:
            - no-new-privileges:true
        networks:
            - app
            - data
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

    commerce:
        image: ${COMMERCE_IMAGE:?COMMERCE_IMAGE is required}
        restart: always
        mem_limit: 512m
        env_file:
            - ../.env.production
        environment:
            CONFIG_FILE: /app/config/config.production.yaml
            APP_MODE: ${APP_MODE:-all}
            TZ: ${TZ:-Asia/Ho_Chi_Minh}
        expose:
            - "8080"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --quiet --spider http://127.0.0.1:8080/api/v1/health || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 30s
        stop_grace_period: 30s
        security_opt:
            - no-new-privileges:true
        networks:
            - app
            - data
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

    ai:
        image: ${AI_IMAGE:?AI_IMAGE is required}
        restart: always
        mem_limit: 512m
        env_file:
            - ../.env.production
        environment:
            CONFIG_FILE: /app/config/config.production.yaml
            APP_MODE: ${APP_MODE:-all}
            TZ: ${TZ:-Asia/Ho_Chi_Minh}
        expose:
            - "8080"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --quiet --spider http://127.0.0.1:8080/api/v1/health || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 30s
        stop_grace_period: 30s
        security_opt:
            - no-new-privileges:true
        networks:
            - app
            - data
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

    # Frozen monolith rollback (FR-043). Built once from the `monolith-legacy`
    # tag, pinned by digest; only used when the owner chooses to roll back.
    backend:
        image: ${MONOLITH_IMAGE:-ghcr.io/placeholder/monolith-legacy:unused}
        profiles:
            - rollback
        restart: always
        mem_limit: 512m
        env_file:
            - ../.env.production
        environment:
            CONFIG_FILE: /app/config/config.production.yaml
            TZ: ${TZ:-Asia/Ho_Chi_Minh}
        expose:
            - "8080"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --quiet --spider http://127.0.0.1:8080/api/v1/health || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 30s
        stop_grace_period: 30s
        security_opt:
            - no-new-privileges:true
        networks:
            - app
            - data
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

    nginx:
        image: nginx:alpine
        restart: always
        mem_limit: 128m
        env_file:
            - ../.env.production
        environment:
            API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
            API_V2_DOMAIN: ${API_V2_DOMAIN:-api-v2.closy.hycat.online}
            NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-20m}
            NGINX_ENVSUBST_FILTER: ^(API_DOMAIN|API_V2_DOMAIN|NGINX_CLIENT_MAX_BODY_SIZE)$
            TZ: ${TZ:-Asia/Ho_Chi_Minh}
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/templates:/etc/nginx/templates:ro
            - /etc/letsencrypt:/etc/letsencrypt:ro
            - certbot_www:/var/www/certbot:ro
        depends_on:
            account:
                condition: service_healthy
            commerce:
                condition: service_healthy
            ai:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --quiet --spider http://127.0.0.1/nginx-health || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - edge
            - app
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

    certbot:
        image: certbot/certbot:v5.3.1
        profiles:
            - maintenance
        volumes:
            - /etc/letsencrypt:/etc/letsencrypt
            - certbot_www:/var/www/certbot

volumes:
    postgres_data:
    redis_data:
    rabbitmq_data:
    certbot_www:

networks:
    edge:
    app:
    admin:
    data:
        internal: true
