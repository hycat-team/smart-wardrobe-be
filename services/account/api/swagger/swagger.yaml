info:
  contact: {}
  description: API docs for the Account service (identity, subscription, admin, notification).
  title: Smart Wardrobe - Account Service API
  version: "1.0"
paths:
  /api/v1/account/health:
    get:
      description: Liveness probe of the Account service.
      produces:
      - application/json
      responses:
        "200":
          description: Liveness payload with status, service, time and mode
          schema:
            type: object
      summary: Account service liveness probe
      tags:
      - Account Health
  /api/v1/admin/activity-events:
    get:
      description: Lấy danh sách phân trang các sự kiện hoạt động (đăng nhập, làm
        mới phiên) kèm danh tính người dùng. Hỗ trợ lọc theo người dùng, loại hoạt
        động và khoảng ngày (ngày lịch Việt Nam). Chỉ đọc.
      parameters:
      - description: ID người dùng (UUID)
        in: query
        name: userId
        type: string
      - description: 'Loại hoạt động: login | refresh'
        in: query
        name: activityType
        type: string
      - description: Từ ngày, bao gồm (YYYY-MM-DD, giờ Việt Nam)
        in: query
        name: fromDate
        type: string
      - description: Đến ngày, bao gồm trọn ngày (YYYY-MM-DD, giờ Việt Nam)
        in: query
        name: toDate
        type: string
      - description: Trang (mặc định 1)
        in: query
        name: page
        type: integer
      - description: Số bản ghi mỗi trang (mặc định 20, tối đa 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Lấy danh sách hoạt động thành công
          schema:
            allOf:
            - $ref: '#/definitions/presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_services_account_dto_identity.ActivityEventListRes'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/presentation.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/presentation.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/presentation.APIResponse'
      summary: Danh sách hoạt động người dùng
      tags:
      - Admin User
  /api/v1/admin/audit-logs:
    get:
      description: Quản trị viên tra cứu lịch sử thao tác của các quản trị viên trong
        hệ thống.
      parameters:
      - description: ID admin thực hiện
        in: query
        name: actorUserId
        type: string
      - description: Hành động
        in: query
        name: action
        type: string
      - description: Loại đối tượng
        in: query
        name: targetType
        type: string
      - description: ID đối tượng
        in: query
        name: targetId
        type: string
      - description: Từ ngày (YYYY-MM-DD)
        in: query
        name: fromDate
        type: string
      - description: Đến ngày (YYYY-MM-DD)
        in: query
        name: toDate
        type: string
      - description: Trang
        in: query
        name: page
        type: integer
      - description: Số bản ghi/trang
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_services_account_dto_admin.AdminAuditLogListRes'
              type: object
      summary: Danh sách nhật ký quản trị (Audit Logs)
      tags:
      - Admin Audit
