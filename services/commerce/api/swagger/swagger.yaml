info:
  contact: {}
  description: API docs for the Commerce Core service (wardrobe, fashion, brand, dashboard).
  title: Smart Wardrobe - Commerce Service API
  version: "1.0"
paths:
  /api/v1/admin/brands:
    get:
      consumes:
      - application/json
      description: Cho phép admin lấy danh sách brand phân trang, tìm kiếm theo tên/slug
        và lọc theo trạng thái của brand.
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: q
        type: string
      - enum:
        - pending_review
        - active
        - suspended
        - archived
        in: query
        name: status
        type: string
        x-enum-varnames:
        - PendingReview
        - Active
        - Suspended
        - Archived
      produces:
      - application/json
      responses:
        "200":
          description: Lấy danh sách brand thành công
          schema:
            allOf:
            - $ref: '#/definitions/presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_brand_application_dto.AdminBrandListRes'
              type: object
      summary: Lấy danh sách brand (Admin)
      tags:
      - Admin Brand
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin brand
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_brand_application_dto.CreateBrandReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_brand_application_dto.BrandRes'
              type: object
      summary: Tạo brand active trực tiếp (Admin)
      tags:
      - Admin Brand
  /api/v1/admin/brands/{brandId}/members:
    get:
      description: Quản trị viên xem danh sách tất cả thành viên của nhãn hàng.
      parameters:
      - description: Brand ID
        in: path
        name: brandId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/presentation.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_brand_application_dto.BrandMemberRes'
                  type: array
              type: object
      summary: Danh sách thành viên nhãn hàng
      tags:
      - Admin Brand
    post:
      consumes:
      - application/json
      description: Quản trị viên gán người dùng làm nhân viên (staff) của nhãn hàng.
      parameters:
      - description: Brand ID
        in: path
        name: brandId
        required: true
        type: string
      - description: Thông tin người dùng
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_brand_application_dto.AdminAddBrandStaffReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_brand_application_dto.BrandMemberRes'
              type: object
      summary: Thêm nhân viên cho nhãn hàng
      tags:
      - Admin Brand
  /api/v1/admin/brands/{brandId}/members/{memberId}:
    delete:
      description: Quản trị viên xóa thành viên khỏi nhãn hàng (bảo vệ chủ sở hữu
        duy nhất).
      parameters:
      - description: Brand ID
        in: path
        name: brandId
        required: true
        type: string
      - description: Member ID
        in: path
        name: memberId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/presentation.APIResponse'
      summary: Gỡ bỏ thành viên khỏi nhãn hàng
      tags:
      - Admin Brand
    patch:
      consumes:
      - application/json
      description: Quản trị viên cập nhật vai trò hoặc trạng thái hoạt động của thành
        viên nhãn hàng.
      parameters:
      - description: Brand ID
        in: path
        name: brandId
        required: true
        type: string
      - description: Member ID
        in: path
        name: memberId
        required: true
        type: string
      - description: Thông tin cập nhật
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_brand_application_dto.AdminUpdateBrandMemberReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_brand_application_dto.BrandMemberRes'
              type: object
      summary: Cập nhật vai trò/trạng thái thành viên
      tags:
      - Admin Brand
  /api/v1/admin/brands/{brandId}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID hoặc slug brand
        in: path
        name: brandId
        required: true
        type: string
      - description: Trạng thái mới
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_brand_application_dto.UpdateBrandStatusReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_brand_application_dto.BrandRes'
              type: object
      summary: Cập nhật trạng thái brand (Admin)
      tags:
      - Admin Brand
  /api/v1/admin/brands/{brandId}/transfer-ownership:
    post:
      consumes:
      - application/json
      description: Quản trị viên chuyển quyền Owner nhãn hàng cho người dùng khác
        trong nhãn hàng, đồng thời chọn hạ chủ cũ thành staff hoặc gỡ hoàn toàn.
      parameters:
      - description: Brand ID
        in: path
        name: brandId
        required: true
        type: string
      - description: Thông tin chuyển giao
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_brand_application_dto.TransferBrandOwnershipReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/presentation.APIResponse'
      summary: Chuyển giao quyền sở hữu nhãn hàng
      tags:
      - Admin Brand
  /api/v1/admin/categories:
    get:
      description: Cho phép Admin lấy danh sách toàn bộ danh mục trang phục trong
        hệ thống để quản trị
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách danh mục
          schema:
            allOf:
            - $ref: '#/definitions/presentation.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_fashion_application_dto.CategoryAPIRes'
                  type: array
              type: object
      summary: Lấy danh sách danh mục trang phục (Admin)
      tags:
      - Admin Category
    post:
      consumes:
      - application/json
      description: Cho phép Admin tạo mới một danh mục trang phục trong hệ thống
      parameters:
      - description: Thông tin danh mục cần tạo
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_fashion_application_dto.CreateCategoryReq'
      produces:
      - application/json
      responses:
        "201":
          description: Thông tin danh mục sau khi tạo
          schema:
            allOf:
            - $ref: '#/definitions/presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_fashion_application_dto.CategoryAPIRes'
              type: object
      summary: Tạo danh mục trang phục (Admin)
      tags:
      - Admin Category
  /api/v1/admin/categories/{id}:
    delete:
      description: Cho phép Admin xóa một danh mục trang phục nếu không còn trang
        phục người dùng liên kết
      parameters:
      - description: ID danh mục
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Xóa danh mục thành công
          schema:
            $ref: '#/definitions/presentation.APIResponse'
      summary: Xóa danh mục trang phục (Admin)
      tags:
      - Admin Category
    get:
      description: Cho phép Admin lấy thông tin chi tiết của một danh mục trang phục
        theo ID
      parameters:
      - description: ID danh mục
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin danh mục
          schema:
            allOf:
            - $ref: '#/definitions/presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_fashion_application_dto.CategoryAPIRes'
              type: object
      summary: Lấy chi tiết danh mục trang phục (Admin)
      tags:
      - Admin Category
    put:
      consumes:
      - application/json
      description: Cho phép Admin cập nhật thông tin của một danh mục trang phục theo
        ID
      parameters:
      - description: ID danh mục
        in: path
        name: id
        required: true
        type: string
      - description: Thông tin danh mục cần cập nhật
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_fashion_application_dto.UpdateCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin danh mục sau khi cập nhật
          schema:
            allOf:
            - $ref: '#/definitions/presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_fashion_application_dto.CategoryAPIRes'
              type: object
      summary: Cập nhật danh mục trang phục (Admin)
      tags:
      - Admin Category
  /api/v1/admin/comments:
    get:
      description: Lấy danh sách bình luận để kiểm duyệt, lọc theo từ khóa
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lấy danh sách bình luận thành công
          schema:
            allOf:
            - $ref: '#/definitions/presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_community_application_dto.AdminCommentListRes'
              type: object
      summary: Danh sách bình luận (quản trị)
      tags:
      - Community Admin
  /api/v1/admin/comments/{commentID}:
    delete:
      description: Xóa mềm bình luận vi phạm; xóa bình luận gốc sẽ xóa luôn các phản
        hồi con
      parameters:
      - description: ID bình luận
        in: path
        name: commentID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Xóa bình luận thành công
          schema:
            $ref: '#/definitions/presentation.APIResponse'
      summary: Xóa bình luận (quản trị)
      tags:
      - Community Admin
  /api/v1/admin/comments/{commentID}/hide:
    patch:
