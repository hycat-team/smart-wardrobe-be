  /api/v1/admin/dashboard/subscriptions/distribution:
    get:
      description: 'Thống kê số người dùng và tỷ lệ phần trăm theo từng gói, dựa trên
        các KHOẢNG HIỆU LỰC gói (không phải gói hiện tại), nên người đã đổi/hạ gói
        sau kỳ vẫn được tính đúng gói đã dùng trong kỳ. Không gửi kỳ: ảnh chụp gói
        đang có hiệu lực tại thời điểm gọi. Có kỳ: khoảng giao với [fromDate, toDate)
        theo ngày lịch Việt Nam. totalUsers là TỔNG CỦA CÁC NHÓM (người đổi gói giữa
        kỳ xuất hiện ở hai nhóm), không phải số người duy nhất. Hai trường tuỳ chọn
        mô tả độ đầy đủ: dataAvailableFrom (ngày VN YYYY-MM-DD, mốc bắt đầu lịch sử
        đầy đủ) và dataCompleteness (complete | partial | unavailable). Kỳ kết thúc
        trước mốc: distribution rỗng và totalUsers = 0, client phải hiển thị trạng
        thái trống thay vì biểu đồ 0%; kỳ cắt ngang mốc: chỉ tính phần sau mốc và
        trả partial.'
      parameters:
      - description: Ngày bắt đầu, ngày lịch Việt Nam (YYYY-MM-DD); bắt buộc ≤ toDate,
          sai định dạng hoặc đảo chiều trả 400
        in: query
        name: fromDate
        type: string
      - description: Ngày kết thúc, ngày lịch Việt Nam (YYYY-MM-DD), bao gồm trọn
          ngày; sai định dạng hoặc đảo chiều trả 400
        in: query
        name: toDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lấy phân bổ subscription thành công
          schema:
            allOf:
            - $ref: '#/definitions/presentation.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/smart-wardrobe-be_services_commerce_internal_modules_dashboard_application_dto.SubscriptionDistributionRes'
