name: Deploy Production (Monolith Legacy Rollback)

# Emergency monolith rollback only (FR-043/FR-056, SC-030).
#
# This workflow MUST NOT build the monolith from `main` (cmd/server is removed
# from main at T034). It builds ONCE from the frozen `monolith-legacy` tag,
# pushes the image to GHCR, and deploys it on the VPS under the compose
# `rollback` profile with the image pinned by digest.
#
# For normal VPS operation use `deploy-vps-services.yml` (3-service topology).

on:
    workflow_dispatch:
        inputs:
            confirm:
                description: "Type 'rollback' to confirm the monolith rollback deploy"
                required: true
                type: string

permissions:
    contents: read
    packages: write

concurrency:
    group: closy-production-rollback
    cancel-in-progress: false

env:
    IMAGE_BASENAME: monolith-legacy

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Refuse unless confirmed
              shell: bash
              run: |
                  if [ "${{ inputs.confirm }}" != "rollback" ]; then
                    echo "Refusing to deploy: confirmation string did not match 'rollback'."
                    exit 1
                  fi

            - name: Checkout (need full history for the legacy tag)
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Verify frozen tag exists and is not main
              shell: bash
              run: |
                  git rev-parse --verify refs/tags/monolith-legacy
                  LEGACY_SHA="$(git rev-list -n 1 monolith-legacy)"
                  MAIN_SHA="$(git rev-list -n 1 origin/main 2>/dev/null || git rev-list -n 1 HEAD)"
                  echo "legacy=${LEGACY_SHA}" >> "${GITHUB_OUTPUT}"
                  if [ "${LEGACY_SHA}" = "${MAIN_SHA}" ]; then
                    echo "monolith-legacy must not equal main"
                    exit 1
                  fi
                  echo "Frozen tag verified: ${LEGACY_SHA}"

    build:
        needs: validate
        runs-on: ubuntu-latest
        outputs:
            image_name: ${{ steps.image.outputs.name }}
            image_digest: ${{ steps.build.outputs.digest }}
            legacy_sha: ${{ steps.tag.outputs.legacy_sha }}
        steps:
            - name: Checkout (compose + legacy Dockerfile come from main)
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Materialize frozen tag tree
              id: tag
              shell: bash
              run: |
                  LEGACY_SHA="$(git rev-list -n 1 monolith-legacy)"
                  echo "legacy_sha=${LEGACY_SHA}" >> "${GITHUB_OUTPUT}"
                  mkdir -p _legacy
                  git archive monolith-legacy | tar -x -C _legacy
                  cp deployments/monolith-legacy/Dockerfile _legacy/Dockerfile.legacy

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Resolve lowercase image name
              id: image
              shell: bash
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_BASENAME}" >> "${GITHUB_OUTPUT}"

            - name: Build and push monolith-legacy image
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: _legacy
                  file: _legacy/Dockerfile.legacy
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.legacy_sha }}
                      ${{ steps.image.outputs.name }}:latest
                  cache-from: type=gha,scope=monolith-legacy
                  cache-to: type=gha,mode=max,scope=monolith-legacy
                  provenance: true
                  sbom: true

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment: vps-production
        steps:
            - name: Checkout deployment files (from main)
              uses: actions/checkout@v4

            - name: Prepare SSH
              shell: bash
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Create deployment archive
              shell: bash
              run: tar -czf /tmp/closy-rollback.tar.gz deployments/docker-compose.prod.yml deployments/nginx deployments/rabbitmq database/init

            - name: Upload deployment archive
              shell: bash
              run: scp -P "${{ secrets.VPS_SSH_PORT }}" /tmp/closy-rollback.tar.gz "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/closy-rollback.tar.gz"

            - name: Log VPS in to private GHCR
              shell: bash
              run: printf '%s' "${{ secrets.GHCR_READ_TOKEN }}" | ssh -p "${{ secrets.VPS_SSH_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin"

            - name: Deploy monolith rollback (compose profile rollback)
              shell: bash
              run: |
                  ssh -p "${{ secrets.VPS_SSH_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
                    set -e
                    mkdir -p /opt/closy
                    tar -xzf /tmp/closy-rollback.tar.gz -C /opt/closy
                    rm -f /tmp/closy-rollback.tar.gz
                    cd /opt/closy
                    touch .env.deploy
                    grep -v '^MONOLITH_IMAGE=' .env.deploy > .env.deploy.next || true
                    printf 'MONOLITH_IMAGE=%s@%s\n' '${{ needs.build.outputs.image_name }}' '${{ needs.build.outputs.image_digest }}' >> .env.deploy.next
                    mv .env.deploy.next .env.deploy
                    chmod 600 .env.deploy
                    docker compose --env-file .env.production --env-file .env.deploy -f deployments/docker-compose.prod.yml config >/dev/null
                    docker compose --env-file .env.production --env-file .env.deploy -f deployments/docker-compose.prod.yml pull backend
                    docker compose --env-file .env.production --env-file .env.deploy -f deployments/docker-compose.prod.yml --profile rollback up -d backend
                    docker compose --env-file .env.production --env-file .env.deploy -f deployments/docker-compose.prod.yml stop account commerce ai || true
                    docker compose --env-file .env.production --env-file .env.deploy -f deployments/docker-compose.prod.yml ps
                  "

            - name: Recreate Nginx for rollback mode
              shell: bash
              run: |
                  ssh -p "${{ secrets.VPS_SSH_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
                    set -e
                    cd /opt/closy
                    docker compose --env-file .env.production --env-file .env.deploy -f deployments/docker-compose.prod.yml up -d --force-recreate nginx
                    docker compose --env-file .env.production --env-file .env.deploy -f deployments/docker-compose.prod.yml ps nginx
                  "

            - name: Verify rollback health
              if: vars.PRODUCTION_HEALTH_URL != ''
              shell: bash
              run: curl --fail --silent --show-error --retry 12 --retry-delay 5 "${{ vars.PRODUCTION_HEALTH_URL }}"
